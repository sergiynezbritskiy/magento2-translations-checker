services:
  php:
    build: .docker/php
    container_name: magento2-translations-checker-php
    platform: linux/amd64
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - XDEBUG_CLIENT_HOST=172.18.0.1
      - PHP_IDE_CONFIG=serverName=phpstorm

  # Same image the Magento 2 module projects use: ships every PHP extension Magento needs and
  # runs as user `magento` (uid 1000), so the sandbox in build/ belongs to the host user.
  magento:
    image: sergiynezbritskiy/magento2-php85:latest
    container_name: magento2-translations-checker-magento
    platform: linux/amd64
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ~/.environment:/home/magento/.environment
